<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="iConnect — the marketplace connecting musicians with gigs." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="iConnect" />
    <meta property="og:title" content="iConnect · Musicians & Gigs" />
    <meta property="og:description" content="Find the right musicians for every gig. Discover performers, post and manage gigs, and book with confidence." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0c0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iConnect" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>iConnect · Musicians & Gigs</title>
    <script>
      // Set the motion gate before first paint so entrance animations never
      // flash. The `motion` class only unlocks animation CSS — every element
      // is fully visible without it (and without any JS at all).
      try {
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('motion');
        }
      } catch (err) {
        /* stay static */
      }
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        #root .boot {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          background: #0c0e14;
          color: #e9ecf5;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        #root .boot-wordmark {
          font-size: 34px;
          font-weight: 800;
          letter-spacing: -0.5px;
        }
        #root .boot-dot {
          display: inline-block;
          width: 0.4em;
          height: 0.4em;
          margin-left: 6px;
          border-radius: 50%;
          background: linear-gradient(135deg, #f5576c, #f093fb);
        }
        #root .boot-ring {
          width: 28px;
          height: 28px;
          border-radius: 50%;
          border: 3px solid rgba(255, 255, 255, 0.12);
          border-top-color: #f5576c;
          animation: boot-spin 0.8s linear infinite;
        }
        #root .boot-hint {
          color: #9aa3b8;
          font-size: 14px;
        }
        @keyframes boot-spin {
          to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
          #root .boot-ring { animation-duration: 2.4s; }
        }
      </style>
      <div class="boot" aria-busy="true">
        <div class="boot-wordmark">iConnect<span class="boot-dot" aria-hidden="true"></span></div>
        <div class="boot-ring" aria-hidden="true"></div>
        <div class="boot-hint">Loading…</div>
      </div>
      <noscript>
        <p style="max-width: 420px; margin: 20px auto; padding: 0 20px; text-align: center; color: #9aa3b8; font-family: sans-serif; font-size: 14px; line-height: 1.55;">
          iConnect needs JavaScript to work. Please enable JavaScript in your
          browser settings and reload this page.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
